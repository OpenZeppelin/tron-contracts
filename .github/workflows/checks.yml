name: checks

on:
  push:
    branches:
      - master
      - next-v*
      - release-v*
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max_old_space_size=8192

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up environment
        uses: ./.github/actions/setup
      - run: npm run lint

  # Build the patched ("-oz-tron") java-tron FullNode.jar once and share it with
  # every job that boots a TRE container. The runtime gates time-warp,
  # snapshot/revert and impersonation on this jar; without it the test harness
  # aborts at pre-flight (see scripts/run-tests-parallel.sh). The build is cached
  # across runs (keyed on the @openzeppelin/hardhat-tron commit pinned in
  # package-lock.json, which build-tre-fork.sh reads) and published as an
  # artifact so dependent jobs download it instead of each rebuilding it.
  build-tre-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore cached FullNode.jar
        id: jar-cache
        uses: actions/cache@v5
        with:
          path: tre/FullNode.jar
          key: tre-jar-${{ hashFiles('package-lock.json') }}
      # build-tre-fork.sh repacks the jar with Python's zipfile. Python 3.12+
      # rejects java-tron's FullNode.jar with "Overlapped entries ... (possible
      # zip bomb)" (overlap check added in 3.12), and the ubuntu-latest runner's
      # system python is 3.12. Pin 3.11 (pre-check) for the repack.
      - name: Set up Python 3.11 (zipfile repack compatibility)
        if: steps.jar-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build patched FullNode.jar
        if: steps.jar-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-tre-fork.sh
      - name: Upload FullNode.jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: tre-fullnode-jar
          path: tre/FullNode.jar
          retention-days: 1
          if-no-files-found: error

  tests:
    runs-on: ubuntu-latest
    needs: build-tre-jar
    env:
      FORCE_COLOR: 1
      # Needed for "eth-gas-reporter" to produce a "gasReporterOutput.json" as documented in
      # https://github.com/cgewecke/eth-gas-reporter/blob/v0.2.27/docs/gasReporterOutput.md
      CI: true
      GAS: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Download patched FullNode.jar
        uses: actions/download-artifact@v4
        with:
          name: tre-fullnode-jar
          path: tre
      - name: Run tests and generate gas report
        run: npm run test
      - name: Check linearisation of the inheritance graph
        run: npm run test:inheritance
      - name: Check pragma validity
        run: npm run test:pragma -- --concurrency 1
      - name: Check procedurally generated contracts are up-to-date
        run: npm run test:generation
      - name: Compare gas costs
        uses: ./.github/actions/gas-compare
        with:
          token: ${{ github.token }}

  tests-upgradeable:
    runs-on: ubuntu-latest
    needs: build-tre-jar
    env:
      FORCE_COLOR: 1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Include history so patch conflicts are resolved automatically
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Download patched FullNode.jar
        uses: actions/download-artifact@v4
        with:
          name: tre-fullnode-jar
          path: tre
      - name: Copy non-upgradeable contracts as dependency
        # The transpiled output imports the stateless peer code from
        # `@openzeppelin/tron-contracts/...`, which upgradeable.patch remaps (in
        # remappings.txt, consumed by both Foundry and Hardhat via
        # hardhat/remappings.js) to `lib/tron-contracts/`. The peer copy MUST
        # land there — copying to lib/openzeppelin-contracts leaves every peer
        # import unresolved at compile time.
        run: |
          mkdir -p lib/tron-contracts
          cp -rnT contracts lib/tron-contracts/contracts
      - name: Transpile to upgradeable
        run: bash scripts/upgradeable/transpile.sh
      - name: Run tests
        run: npm run test
      - name: Check linearisation of the inheritance graph
        run: npm run test:inheritance
      - name: Check pragma validity
        run: npm run test:pragma -- --concurrency 1
      - name: Check storage layout
        uses: ./.github/actions/storage-layout
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'breaking change') }}
        with:
          token: ${{ github.token }}

  tests-foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Run tests
        run: forge test --via-ir -vvv

  coverage:
    runs-on: ubuntu-latest
    needs: build-tre-jar
    steps:
      - uses: actions/checkout@v6
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Download patched FullNode.jar
        uses: actions/download-artifact@v4
        with:
          name: tre-fullnode-jar
          path: tre
      - name: Run coverage
        run: npm run coverage
      - uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Compile harnesses
        run: |
          make -C fv apply
          npm run compile:harnesses

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up environment
        uses: ./.github/actions/setup
      - uses: crytic/slither-action@v0.4.1

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run CodeSpell
        uses: codespell-project/actions-codespell@v2.2
        with:
          check_hidden: true
          check_filenames: true
          # Skip vendored third-party code: `vendor` and `lib` (Foundry deps such as
          # forge-std, which carry their own typos we don't control).
          skip: package-lock.json,*.pdf,vendor,lib
          # "TRE" = TRON Runtime Environment (used throughout the TVM toolchain);
          # codespell otherwise flags it as a misspelling of "tree"/"the".
          ignore_words_list: tre
