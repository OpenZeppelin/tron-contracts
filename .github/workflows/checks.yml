name: checks

on:
  push:
    branches:
      - master
      - next-v*
      - release-v*
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max_old_space_size=8192

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up environment
        uses: ./.github/actions/setup
      - run: npm run lint

  # Build the patched ("-oz-tron") java-tron FullNode.jar once and share it with
  # every job that boots a TRE container. The runtime gates time-warp,
  # snapshot/revert and impersonation on this jar; without it the test harness
  # aborts at pre-flight (see scripts/run-tests-parallel.sh). The build is cached
  # across runs (keyed on the @openzeppelin/hardhat-tron commit pinned in
  # package-lock.json, which build-tre-fork.sh reads) and published as an
  # artifact so dependent jobs download it instead of each rebuilding it.
  build-tre-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore cached FullNode.jar
        id: jar-cache
        uses: actions/cache@v5
        with:
          path: tre/FullNode.jar
          # The jar is compiled against the pinned TRE image's stock FullNode.jar,
          # so a digest bump in pin-tre-image.sh must invalidate the cache too.
          key: tre-jar-${{ hashFiles('package-lock.json', 'scripts/pin-tre-image.sh') }}
      - name: Build patched FullNode.jar
        if: steps.jar-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-tre-fork.sh
      - name: Upload FullNode.jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: tre-fullnode-jar
          path: tre/FullNode.jar
          retention-days: 1
          if-no-files-found: error

  tests:
    runs-on: ubuntu-latest
    needs: build-tre-jar
    env:
      FORCE_COLOR: 1
      # Needed for "eth-gas-reporter" to produce a "gasReporterOutput.json" as documented in
      # https://github.com/cgewecke/eth-gas-reporter/blob/v0.2.27/docs/gasReporterOutput.md
      CI: true
      GAS: true
    steps:
      - uses: actions/checkout@v6
        with:
          # The transpiled (-upgradeable) build imports its stateless peer code
          # from the `lib/tron-contracts` submodule (remapped in remappings.txt);
          # check it out so compilation resolves. No-op in this repo (which has no
          # such submodule), so the non-upgradeable CI is unchanged.
          submodules: ${{ endsWith(github.repository, '-upgradeable') && 'true' || 'false' }}
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Download patched FullNode.jar
        uses: actions/download-artifact@v4
        with:
          name: tre-fullnode-jar
          path: tre
      # Cache the compiled corpus (artifacts + generated $ wrappers). The output
      # is a pure function of the contract sources, the compiler config and the
      # tron-solc version, so key on those. NO restore-keys: a partial hit would
      # silently run the suite against stale bytecode.
      - name: Restore compiled artifacts
        id: tron-artifacts
        uses: actions/cache@v5
        with:
          path: |
            artifacts
            contracts-exposed
          key: tron-artifacts-${{ hashFiles('contracts/**/*.sol', 'hardhat.config.js', 'tron-batches.config.cjs', 'remappings.txt', 'package-lock.json') }}
      - name: Run tests and generate gas report
        run: npm run test
        env:
          # On a cache hit the corpus is already compiled — skip exposed:regen +
          # the tron batched compile inside run-tests-parallel.sh.
          SKIP_COMPILE: ${{ steps.tron-artifacts.outputs.cache-hit == 'true' && '1' || '' }}
      # The checks below validate the SOURCE contracts — inheritance ordering,
      # pragma ranges, procedurally-generated files, and gas regression — and do
      # not apply to the transpiled -upgradeable output, which imports stateless
      # code (e.g. utils/math/SafeCast.sol) from the peer instead of emitting it
      # (so test:generation can't even find it). The behavioural suite above
      # (npm run test) is what validates the transpilation; skip these source-only
      # meta-checks in the -upgradeable repo.
      - name: Check linearisation of the inheritance graph
        if: ${{ !endsWith(github.repository, '-upgradeable') }}
        run: npm run test:inheritance
      # test:pragma recompiles every contract (per-file, to validate its pragma
      # range) — pure contract work. A cache hit means the corpus is byte-for-byte
      # a prior state where pragma already passed, so skip it: test-only changes
      # then do zero compilation. It always runs when contracts change (miss).
      - name: Check pragma validity
        if: ${{ !endsWith(github.repository, '-upgradeable') && steps.tron-artifacts.outputs.cache-hit != 'true' }}
        run: npm run test:pragma -- --concurrency 1
      - name: Check procedurally generated contracts are up-to-date
        if: ${{ !endsWith(github.repository, '-upgradeable') }}
        run: npm run test:generation
      - name: Compare gas costs
        if: ${{ !endsWith(github.repository, '-upgradeable') }}
        uses: ./.github/actions/gas-compare
        with:
          token: ${{ github.token }}

  tests-upgradeable:
    # Applies upgradeable.patch + re-runs the transpiler on the source tree; only
    # meaningful in the non-upgradeable source repo. The -upgradeable repo is
    # already transpiled, so this would re-patch renamed/absent files and fail.
    if: ${{ !endsWith(github.repository, '-upgradeable') }}
    runs-on: ubuntu-latest
    needs: build-tre-jar
    env:
      FORCE_COLOR: 1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Include history so patch conflicts are resolved automatically
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Download patched FullNode.jar
        uses: actions/download-artifact@v4
        with:
          name: tre-fullnode-jar
          path: tre
      - name: Copy non-upgradeable contracts as dependency
        # The transpiled output imports the stateless peer code from
        # `@openzeppelin/tron-contracts/...`, which upgradeable.patch remaps (in
        # remappings.txt, consumed by both Foundry and Hardhat via
        # hardhat/remappings.js) to `lib/tron-contracts/`. The peer copy MUST
        # land there — copying to lib/openzeppelin-contracts leaves every peer
        # import unresolved at compile time.
        run: |
          mkdir -p lib/tron-contracts
          cp -rnT contracts lib/tron-contracts/contracts
      - name: Transpile to upgradeable
        run: bash scripts/upgradeable/transpile.sh
      # Runs AFTER transpile so the key hashes the transpiled corpus — distinct
      # from the non-upgradeable cache. No restore-keys (see the tests job).
      #
      # MUST also hash the peer tree (lib/tron-contracts/contracts): the
      # transpiler moves stateless code (interfaces, libraries such as
      # SlotDerivation) OUT of contracts/ and imports it from the peer, so the
      # hardhat-exposed `$` wrappers for that code are generated from the peer
      # copy (contracts-exposed/$_/@openzeppelin/tron-contracts/...). A change
      # confined to a peer library — e.g. renaming an internal function — then
      # leaves contracts/ byte-identical, so without the peer in the key the job
      # hits a stale cache and (SKIP_COMPILE=1) runs against stale wrappers. This
      # is the exact "stale bytecode" hazard the tests-job key comment warns of.
      - name: Restore compiled artifacts (upgradeable)
        id: tron-artifacts
        uses: actions/cache@v5
        with:
          path: |
            artifacts
            contracts-exposed
          key: tron-artifacts-upgradeable-${{ hashFiles('contracts/**/*.sol', 'lib/tron-contracts/contracts/**/*.sol', 'hardhat.config.js', 'tron-batches.config.cjs', 'remappings.txt', 'package-lock.json') }}
      - name: Run tests
        run: npm run test
        env:
          SKIP_COMPILE: ${{ steps.tron-artifacts.outputs.cache-hit == 'true' && '1' || '' }}
      - name: Check linearisation of the inheritance graph
        run: npm run test:inheritance
      # Skip the per-file pragma recompile on a cache hit (see the tests job).
      - name: Check pragma validity
        if: steps.tron-artifacts.outputs.cache-hit != 'true'
        run: npm run test:pragma -- --concurrency 1
      - name: Check storage layout
        uses: ./.github/actions/storage-layout
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'breaking change') }}
        with:
          token: ${{ github.token }}

  tests-foundry:
    # The Foundry tests import non-upgradeable contract paths directly (e.g.
    # contracts/token/TRC20/TRC20.sol), which don't exist in the transpiled tree
    # (they become *Upgradeable.sol or move to the peer). Not run in -upgradeable.
    if: ${{ !endsWith(github.repository, '-upgradeable') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Run tests
        run: forge test --via-ir -vvv

  coverage:
    runs-on: ubuntu-latest
    needs: build-tre-jar
    steps:
      - uses: actions/checkout@v6
        with:
          # See the `tests` job: peer submodule needed to compile in the
          # -upgradeable repo; no-op here.
          submodules: ${{ endsWith(github.repository, '-upgradeable') && 'true' || 'false' }}
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Download patched FullNode.jar
        uses: actions/download-artifact@v4
        with:
          name: tre-fullnode-jar
          path: tre
      - name: Run coverage
        run: npm run coverage
      - uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  harnesses:
    # `make -C fv apply` patches non-upgradeable contract paths and the FV suite
    # verifies the source contracts; neither applies to the transpiled repo.
    if: ${{ !endsWith(github.repository, '-upgradeable') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Compile harnesses
        run: |
          make -C fv apply
          npm run compile:harnesses

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # See the `tests` job: peer submodule needed so Slither can resolve the
          # transpiled output's imports in the -upgradeable repo; no-op here.
          submodules: ${{ endsWith(github.repository, '-upgradeable') && 'true' || 'false' }}
      - name: Set up environment
        uses: ./.github/actions/setup
      - uses: crytic/slither-action@v0.4.1

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run CodeSpell
        uses: codespell-project/actions-codespell@v2.2
        with:
          check_hidden: true
          check_filenames: true
          # Skip vendored third-party code: `vendor` and `lib` (Foundry deps such as
          # forge-std, which carry their own typos we don't control).
          skip: package-lock.json,*.pdf,vendor,lib
          # "TRE" = TRON Runtime Environment (used throughout the TVM toolchain);
          # codespell otherwise flags it as a misspelling of "tree"/"the".
          ignore_words_list: tre
