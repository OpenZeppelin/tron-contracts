[profile.default]
solc_version = '0.8.26'
evm_version = 'cancun'
optimizer = true
optimizer_runs = 200
# Required: several contracts use the `require(cond, CustomError())` overload,
# which only compiles via the IR pipeline. `forge test` is invoked with
# `--via-ir` explicitly, but tools that run a bare `forge build` (e.g. halmos)
# need it from config or they fail with "Require with a custom error is only
# available using the via-ir pipeline."
via_ir = true
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test'
cache_path  = 'cache_forge'
fs_permissions = [{ access = "read", path = "./node_modules/hardhat-predeploy/bin" }]

[lint]
exclude_lints = ["mixed-case-function", "asm-keccak256", "screaming-snake-case-immutable", "incorrect-shift", "mixed-case-variable"]
ignore = ["./contracts/interfaces/**/*.sol", "./contracts/mocks/Stateless.sol"]
lint_on_build = false

[fuzz]
runs = 5000
max_test_rejects = 150000
